[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parenting-kb"
version = "0.1.0"
description = "育儿知识库智能问答系统（导入服务 + 查询服务）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "pymongo>=4.8.0",
    "minio>=7.2.0",
    "pymilvus[model]>=2.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "FlagEmbedding>=1.3.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "modelscope>=1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
